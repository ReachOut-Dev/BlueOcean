<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Ocean HVAC - A/C Repair & Installation in McKinney, TX</title>
    <base href="/BlueOcean/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlueOceanAppWASM.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/culture.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            const culture = window.culture.getStartupCulture();
            window.culture.setDocumentLang(culture);
            Blazor.start({ applicationCulture: culture });
        })();
    </script>
</body>

</html>
